<!DOCTYPE html>
<html lang="pt-BR">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Diagnóstico de Desassentamento</title>
    <!-- Bootstrap CSS para estilo rápido e responsivo -->
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/css/bootstrap.min.css" rel="stylesheet">
    <link rel="stylesheet" href="style.css">
    <!-- Biblioteca html2pdf (precisa vir ANTES do script.js, pois este a utiliza) -->
    <script src="https://cdnjs.cloudflare.com/ajax/libs/html2pdf.js/0.10.1/html2pdf.bundle.min.js"></script>
</head>
<body class="bg-light">

<div class="container my-5">
    <div class="card shadow">
        <div class="card-header bg-primary text-white">
            <h3 class="mb-0">Formulário de Diagnóstico Prévio - Desassentamento</h3>
        </div>
        <div class="card-body">
            <form id="diagnosticoForm">

                <!-- SEÇÃO 1 -->
                <h5 class="text-secondary mt-3 border-bottom pb-2">1. Identificação do Diagnóstico</h5>
                <div class="row g-3">
                    <div class="col-md-6"><label>Nome da comunidade:</label><input type="text" class="form-control" name="comunidade" required></div>
                    <div class="col-md-6"><label>Município/UF:</label><input type="text" class="form-control" name="municipio" required></div>
                    <div class="col-md-6"><label>Empreendimento relacionado:</label><input type="text" class="form-control" name="empreendimento"></div>
                    <div class="col-md-6"><label>Tipo de empreendimento:</label><input type="text" class="form-control" name="tipoEmpreendimento"></div>
                    <div class="col-md-6"><label>Órgão/empresa responsável:</label><input type="text" class="form-control" name="orgaoResponsavel"></div>
                    <div class="col-md-6"><label>Data da aplicação:</label><input type="date" class="form-control" name="dataAplicacao"></div>
                    <div class="col-md-6"><label>Responsável pelo diagnóstico:</label><input type="text" class="form-control" name="responsavelDiagnostico"></div>
                    <div class="col-md-6"><label>Número de famílias/moradores participantes:</label><input type="number" class="form-control" name="numFamilias"></div>
                    <div class="col-12"><label>Situação da comunidade em relação ao empreendimento:</label><textarea class="form-control" name="situacaoComunidade" rows="2"></textarea></div>
                </div>

                <!-- SEÇÃO 2 -->
                <h5 class="text-secondary mt-5 border-bottom pb-2">2. Caracterização Socioeconômica</h5>
                <div class="row g-3">
                    <div class="col-md-6"><label>Há quanto tempo mora nesta comunidade?</label><input type="text" class="form-control" name="tempoMoradia"></div>
                    <div class="col-md-6"><label>Quantas pessoas residem no domicílio?</label><input type="number" class="form-control" name="pessoasDomicilio"></div>
                    <div class="col-12"><label>Qual é a principal fonte de renda da família?</label><input type="text" class="form-control" name="fonteRenda"></div>
                    <div class="col-12"><label>Algum membro da família trabalha ou desenvolve atividade econômica dentro da própria comunidade?</label><textarea class="form-control" name="atividadeEconomicaLocal" rows="2"></textarea></div>
                    <div class="col-12"><label>A renda familiar sofreu ou poderá sofrer alteração em razão do empreendimento?</label><textarea class="form-control" name="alteracaoRenda" rows="2"></textarea></div>
                </div>

                <!-- SEÇÃO 3 -->
                <h5 class="text-secondary mt-5 border-bottom pb-2">3. Relação com o Território</h5>
                <div class="row g-3">
                    <div class="col-12"><label>Há quanto tempo sua família possui relação com este local?</label><input type="text" class="form-control" name="tempoRelacaoLocal"></div>
                    <div class="col-12"><label>Quais lugares da comunidade são importantes para você e sua família?</label><textarea class="form-control" name="lugaresImportantes" rows="2"></textarea></div>
                    <div class="col-12"><label>Existem relações de parentesco ou amizade próximas dentro da comunidade?</label><textarea class="form-control" name="relacoesProximas" rows="2"></textarea></div>
                    <div class="col-12"><label>Sua atividade profissional depende da localização da comunidade?</label><textarea class="form-control" name="dependenciaProfissional" rows="2"></textarea></div>
                    <div class="col-12"><label>Você considera importante permanecer próximo ao local onde vive atualmente?</label><textarea class="form-control" name="importanciaPermanencia" rows="2"></textarea></div>
                    <div class="col-12"><label>O que você considera que perderia caso tivesse que deixar essa área?</label><textarea class="form-control" name="perdasPossiveis" rows="3"></textarea></div>
                </div>

                <div class="mt-4 text-center">
                    <button type="submit" class="btn btn-success btn-lg px-5">Gerar Relatório em PDF</button>
                </div>
            </form>
        </div>
    </div>
</div>

<!-- script.js vem no fim do body: garante que o formulário já existe no DOM quando o script roda -->
<script src="script.js"></script>
</body>
</html>
